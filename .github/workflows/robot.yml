name: Generate Robot Commit Animation

on:
  schedule:
    - cron: "0 */12 * * *" # atualiza 2x por dia
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk@v3
        with:
          github_user_name: denerbatista
          outputs: |
            dist/github-robot.svg?color_snake=00FFAA&color_dots=#00FFAA,#009944,#004422
            dist/github-robot-dark.svg?palette=github-dark&color_snake=00FFAA&color_dots=#00FFAA,#00DD88,#003322
      - name: Push output to branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
